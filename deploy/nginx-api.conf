# Install as /etc/nginx/snippets/postmark-api.conf and include from every
# server {} that fronts the office: postmark.town (canonical — see
# nginx-postmark-town.conf) and starforge-atelier.online (legacy alias).

# OAuth discovery (RFC 9728 / 8414) — MCP clients fetch these at the ORIGIN
# root, outside /api/, so they get their own passthrough (path NOT stripped).
# X-Forwarded-For on every location that reaches the office (2026-10-13, the
# review of office #516): these two passed the raw URI with none, and a
# backslash path nginx matches here the office's URL parse resolves to any
# door, arriving with no caller address at all. The office's box door no longer
# reads headers, but the bouncer still keys every limit on the caller.
# INSTALLED on the box 2026-10-13 12:0x EDT (Darko's go), with the dev twin in
# nginx-postmark-dev.conf; this file matches /etc/nginx/snippets/postmark-api.conf.
location /.well-known/oauth- {
    proxy_pass http://127.0.0.1:4380;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# OIDC-shaped discovery alias (ChatGPT-compat pass 2026-08-17): some MCP
# clients probe openid-configuration first or only; the office serves the
# same AS metadata there.
location /.well-known/openid-configuration {
    proxy_pass http://127.0.0.1:4380;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}


# ── THE MAP AND THE APEX, SERVED STALE WHEN THE OFFICE IS BUSY (2026-09-27 00:4xZ, Snug night, Wright, Keemin's caching go) ──
# The World page cannot draw without the skeleton, and it was the one read on the
# page with no cache: under the party's load it timed out and the page never
# loaded. Both change rarely, so 10 minutes, and the last good copy is served
# through a slow or failing office. Before the five-read regex: first regex wins.
location = /api/world/skeleton {
    limit_req zone=postmark_keyless burst=240 nodelay;
    limit_req_status 429;
    error_page 429 = @postmark_keyless_rate;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:4380;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering on;
    proxy_cache pmworld;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$host$uri$is_args$args|$http_authorization";
    proxy_cache_valid 200 10m;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 60s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    add_header X-PM-Cache $upstream_cache_status always;
    proxy_read_timeout 90s;
}

# ── THE PAGE'S HISTORY READS, CACHED (2026-09-27 00:5xZ, Snug night, Wright, Keemin's caching go) ──
# The World page also waits on these four; uncached, each took ~18 s under the
# party's load.
#
# walks KEYS ON ITS ARGS (POS-620, 2026-10-15). Its key used to ignore them, on
# the reasoning that the World page's `since` ("two weeks ago", to the second)
# differs on every load and a copy made seconds earlier covers the same two
# weeks. But the door answers other questions too: `?since=2026-08-01` and
# `?last=6000` were served whatever fortnight the World page last cached
# (`window.since` 09-30 on 10-14), and so was the World page's own "more", which
# widens the window a fortnight at a time. A cache keyed without the question
# answers a question nobody asked. Uncached, the read took 0.4 s on prod on
# 2026-10-15 22:48 EDT (a quiet hour). test/nginx-cache-keys.test.mjs holds
# every cached location's key to the args its door reads.
location = /api/world2/walks {
    limit_req zone=postmark_keyless burst=240 nodelay;
    limit_req_status 429;
    error_page 429 = @postmark_keyless_rate;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:4380;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering on;
    proxy_cache pmworld;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$host$uri$is_args$args|$http_authorization";
    proxy_cache_valid 200 30s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 60s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    add_header X-PM-Cache $upstream_cache_status always;
    proxy_read_timeout 90s;
}
