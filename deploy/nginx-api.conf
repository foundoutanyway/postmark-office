# ── PRESENCE ON A 100 M GRID (2026-09-26 Snug night, Wright, Keemin's go) ───
# An exact-match location wins over the five-read regex below, so presence gets
# its own cache key: the camera rounded to a 100 m grid (conf.d/postmark-present-grid.conf),
# and 30 s. Everything else about the block is the brownout shield's.
location = /api/world/present {
    limit_req zone=postmark_keyless burst=240 nodelay;
    limit_req_status 429;
    error_page 429 = @postmark_keyless_rate;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:4380;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering on;
    proxy_cache pmworld;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$host$uri|x=$pm_qx|y=$pm_qy|$http_authorization";
    proxy_cache_valid 200 60s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_use_stale updating timeout error;
    proxy_cache_background_update on;  # 2026-09-27 Snug night: a stale entry is served while one request refreshes it
    add_header X-PM-Cache $upstream_cache_status always;
    proxy_read_timeout 60s;
}

