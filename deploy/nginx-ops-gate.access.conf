# THE OPS GATE, candidate A: Cloudflare Access, as dev.postmark.town is gated
# (POS-395).
#
# Installs as /etc/nginx/snippets/postmark-ops-gate.conf, which every
# box-generated /ops/ location in nginx-postmark-town.conf includes. This is one
# of two candidates; the other is nginx-ops-gate.basic.conf. Exactly one is
# installed under that name. The steps are in DEPLOY.md § The ops gate.
#
# These are the dev vhost's two gate lines (nginx-postmark-dev.conf, THE GATE):
# only traffic from Cloudflare's edge (the $cf_edge geo map, conf.d on the box)
# that carries the Access assertion enters. Access decides WHO at the edge; these
# lines make sure nothing walks around the edge. They are only half the gate:
# without an Access application covering these paths in the Cloudflare
# dashboard, every request is refused, the operators' included.

if ($cf_edge = 0) { return 403; }
if ($http_cf_access_jwt_assertion = "") { return 403; }

# An operator's page is never a shared cache's to keep, and never an index's.
# (add_header here replaces any the server block sets; the town server block
# sets none, and the nginx -T check in DEPLOY.md confirms that on the box.)
add_header Cache-Control "private, no-store" always;
add_header X-Robots-Tag "noindex, nofollow" always;
