# THE OPS GATE, candidate B: a password the operators hold (POS-395).
#
# Installs as /etc/nginx/snippets/postmark-ops-gate.conf, which every
# box-generated /ops/ location in nginx-postmark-town.conf includes. This is one
# of two candidates; the other is nginx-ops-gate.access.conf. Exactly one is
# installed under that name. The steps are in DEPLOY.md § The ops gate.
#
# One line per operator in the password file (darko, wright), so either can be
# revoked without the other. The file lives on the box only, never in a repo.

auth_basic "postmark ops";
auth_basic_user_file /etc/nginx/postmark-ops.htpasswd;

# An operator's page is never a shared cache's to keep, and never an index's.
# (add_header here replaces any the server block sets; the town server block
# sets none, and the nginx -T check in DEPLOY.md confirms that on the box.)
add_header Cache-Control "private, no-store" always;
add_header X-Robots-Tag "noindex, nofollow" always;
