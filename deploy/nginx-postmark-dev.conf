server {
    listen 80;
    listen [::]:80;
    server_name dev.postmark.town;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.postmark.town;
    ssl_certificate /etc/letsencrypt/live/dev.postmark.town/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.postmark.town/privkey.pem;

    # THE GATE (release-channels D2, final form): only Cloudflare-edge traffic
    # (geo map in conf.d/cf-edge-map.conf) carrying the post-auth Access JWT
    # enters. Access decides WHO at the edge (Keemin's email / the fleet
    # service token); these two lines ensure nothing walks around the edge.
    if ($cf_edge = 0) { return 403; }
    if ($http_cf_access_jwt_assertion = "") { return 403; }

    # the dev SITE (static build; snapshot channel) + the dev OFFICE at /api/
    root /var/www/postmark-dev-site;
    index index.html;

    # THE WORLD ENGINE REVALIDATES, ALWAYS (2026-09-11, Keemin's go). Dev sent no
    # Cache-Control on /world-engine/*.mjs at all, which hands the browser
    # HEURISTIC freshness off Last-Modified — commonly a tenth of the file's age,
    # so hours — and a train push that redeploys dev cannot dislodge a copy the
    # browser never asks about (2026-09-10: Keemin's tab ran the old viewer until
    # a hard reload). Twin of the block in nginx-postmark-town.conf; if that one
    # changes, change this one too.
    #
    # no-cache does NOT mean do-not-store: the browser keeps the file and asks
    # first, and nginx answers 304 from the ETag it already emits, so the cost is
    # one conditional round-trip, not a 600 KB re-download.
    #
    # ORDER IS LOAD-BEARING: nginx takes the FIRST matching regex location, not
    # the most specific one. This block must stay ABOVE the general \.mjs$ block.
    location ~* ^/world-engine/.+\.mjs$ {
        types { } default_type text/javascript;
        add_header Cache-Control "no-cache";
    }
    # ES modules must arrive as text/javascript — the browser refuses
    # application/octet-stream (the /world island imports /world-engine/*.mjs).
    # Same block as prod's vhost; dev learned it the hard way 2026-08-22.
    location ~* \.mjs$ {
        types { } default_type text/javascript;
    }

    # OAuth discovery at the ORIGIN ROOT (RFC 9728 / 8414), the two bare forms
    # prod serves from deploy/nginx-api.conf (postmark#2915, Linear POS-132):
    # the office 401 names its own resource_metadata URL under /.well-known/,
    # outside /api/, and until this block dev answered it 404 while prod
    # answered 200, so OAuth discovery from a bare shell could not complete on
    # dev. Same shape as prod, path NOT stripped, dev office on :4381. Twin of
    # the prod snippet — if that one changes, change this one too.
    # X-Forwarded-For on both, as prod: INSTALLED on the box 2026-10-13 12:0x EDT
    # (/etc/nginx/sites-enabled/postmark-dev), with nginx-api.conf's twin.
    location /.well-known/oauth- {
        proxy_pass http://127.0.0.1:4381;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /.well-known/openid-configuration {
        proxy_pass http://127.0.0.1:4381;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4381/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }


    # /shelf/ — resident-supplied art, proxied to the media host exactly as
    # prod's vhost does (2026-08-28, dress-rehearsal find: the parlor's marks
    # carry /shelf/ images and dev had no such door — three broken-image tiles
    # where the dungeon furniture should be). The SVG hardening headers ride
    # with it for the same reasons as prod; see nginx-postmark-town.conf's
    # /shelf/ block for the full ruling. Copy-of-record note: this block is a
    # deliberate twin — if prod's changes, change this one too.
    location /shelf/ {
        resolver 127.0.0.53 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $shelf_upstream media.postmark.town;
        rewrite ^/shelf/(.*)$ /media/$1 break;
        proxy_pass https://$shelf_upstream;
        proxy_set_header Host media.postmark.town;
        proxy_ssl_server_name on;
        proxy_cache_valid 200 10m;
        add_header Cache-Control "public, max-age=600" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition $shelf_disposition always;
    }


    # /ops/mcp-prototype/ — the ontology surface (office repo, ops/mcp-prototype/).
    #
    # THIS VHOST ONLY, DELIBERATELY. The block must never be copied into
    # nginx-postmark-town.conf or any other production vhost. It is a raw MCP
    # console: it renders whatever tools/list currently answers, including doors
    # that are half-built, delisted, or behind a flag, and it is a form that
    # POSTs tools/call with whatever key its reader pasted. Its safety is
    # entirely the two GATE lines at the top of this server block — Cloudflare
    # edge + Access JWT — which nothing on postmark.town has.
    #
    # Alias out of the site webroot on purpose: the dev site deploy rsyncs
    # --delete into /var/www/postmark-dev-site with no excludes, so anything
    # sitting in there that the site build does not produce is erased on the
    # next publish. Same shape as the town vhost's /ops/<name>/ dashboards.
    # DEPLOY: copy the office repo's ops/mcp-prototype/*.{html,css,js} to
    # /var/www/postmark-ops/mcp-prototype/ (index.html, mcp-proto.css,
    # mcp-proto.js — test-offline.html is a local harness, not shipped).
    location = /ops/mcp-prototype { return 301 /ops/mcp-prototype/; }
    location /ops/mcp-prototype/ {
        alias /var/www/postmark-ops/mcp-prototype/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
