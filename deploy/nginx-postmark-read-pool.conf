# nginx-postmark-read-pool.conf — the SERVER-level half of DEC-4 / G3.
#
# PROPOSED. NOTHING HERE HAS BEEN APPLIED TO THE BOX. /etc/nginx was read only.
#
# Installs as /etc/nginx/snippets/postmark-api.conf, REPLACING the live one —
# so it must contain EVERY location that file contains. It now does: the live
# snippet has seven, this has nine (the seven, plus the two writer pins the
# OAuth dance needs).
#
# ⚑ THE LAP-2 VERSION OF THIS FILE HAD THREE, AND WOULD HAVE DELETED FOUR.
# It carried a section headed "NOT TOUCHED, and named so a reader knows the
# omission is deliberate", listing the two root `.well-known` locations, the two
# `/mcp` courtesy redirects and the named rate-limit location. Every one of
# those lives IN THE FILE BEING REPLACED. A comment cannot carry a location
# forward; only the file can. The g3 reviewer caught the two discovery blocks by
# reading the box; re-reading the live file for this lap found three more.
# **When a file replaces another, "unchanged" is a claim about content it must
# actually hold.**
#
# ⚑ ITS HTTP-LEVEL HALF IS A SEPARATE FILE. `upstream` and `map` are
# http-context and cannot live here (this snippet is included inside a server{}
# block). They ship as deploy/nginx-postmark-read-pool-upstreams.conf →
# /etc/nginx/conf.d/. Install that FIRST, or `nginx -t` refuses the whole config
# on an unknown upstream name.
#
# What it does: GET and HEAD under /api/ go to a pool of read-only workers;
# every write, the MCP door, AND THE WHOLE OAUTH DANCE go to the one writer.

# ── the OAuth dance is the WRITER'S, whatever the method ────────────────────
#
# ⚑ THIS PIN IS THE FIX FOR A BREAK THAT WOULD HAVE STOPPED SIGN-IN, and it was
# found by driving the lap-2 confs rather than by reading them. `map
# $request_method` sends every GET under /api/ to the pool; the office's own
# `workerSafe` correctly refuses /oauth* there. Both halves were right on their
# own and they disagreed with each other, and only the office half had a test.
# Driven on the reviewer's scratch nginx at the previous pin:
#
#   GET /api/oauth/authorize            -> 405 from a WORKER   <- sign-in entry
#   GET /api/oauth/github/callback      -> 405 from a WORKER   <- GitHub's return
#   GET /api/oauth/berth-cosign         -> 405 from a WORKER   <- the berth co-sign
#   GET /api/.well-known/openid-configuration -> 405 from a WORKER
#
# These are the URLs prod advertises right now — `PUBLIC_BASE` defaults to
# https://postmark.town/api (src/oauth.mjs:31), so live discovery answers
# "authorization_endpoint": "https://postmark.town/api/oauth/authorize".
#
# `^~` so this beats the regex world-cache block and the plain /api/ prefix.
# And it is a pin to the writer for EVERY method, not a map lookup: the dance's
# first act is `sweep(odb)`, three DELETEs, so a GET here is a write.
location ^~ /api/oauth/ {
    limit_req zone=postmark_keyless burst=240 nodelay;
    limit_req_status 429;
    error_page 429 = @postmark_keyless_rate;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://postmark_office_writer;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    add_header X-PM-Upstream $upstream_addr always;
}

# Discovery under /api/ — the same handler, the same sweep, the same pin.
location ^~ /api/.well-known/ {
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://postmark_office_writer;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 2026-10-13: every location names the caller (nginx-api.conf § discovery)
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-PM-Upstream $upstream_addr always;
}

# ── CARRIED FORWARD FROM THE LIVE SNIPPET (X-Forwarded-For added 2026-10-13) ─
#
# OAuth discovery (RFC 9728 / 8414) — MCP clients fetch these at the ORIGIN
# root, outside /api/, so they get their own passthrough (path NOT stripped).
# Pointed at the writer by name rather than 127.0.0.1:4380 so there is one
# place the writer's address is written down; the upstream holds a single
# server on that port.
location /.well-known/oauth- {
    proxy_pass http://postmark_office_writer;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# OIDC-shaped discovery alias (ChatGPT-compat pass 2026-08-17): some MCP
# clients probe openid-configuration first or only; the office serves the
# same AS metadata there.
location /.well-known/openid-configuration {
    proxy_pass http://postmark_office_writer;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# ── the MCP door is the writer's, whatever the method ───────────────────────
#
# The office refuses /mcp on a worker (405), so a misroute would not be
# dangerous — but it would be a 405 in front of a connector at CONNECT time, and
# a connector that gets anything but 401 + resource_metadata never offers its
# human the sign-in. Streaming, so buffering stays off and the timeout long.
location = /api/mcp {
    limit_req zone=postmark_keyless burst=240 nodelay;
    limit_req_status 429;
    error_page 429 = @postmark_keyless_rate;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://postmark_office_writer;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 1m;
    add_header X-PM-Upstream $upstream_addr always;
}

# ── the five hot world reads: the brownout shield, now over the pool ────────
#
# Every cache directive here is byte-for-byte the shield installed 2026-08-29 —
# the same key, the same validity, the same lock. Only the upstream changed.
# This block is where the pool pays for itself: these reads cost ~1.2 s of CPU
# each on a miss.
#
# ⚑ A CORRECTION CARRIED FROM THE LIVE FILE: its comment says "micro-cached 2s
# per auth token" over a directive reading `proxy_cache_valid 200 30s`. The code
# is the truth; the comment has been wrong since the night it was written in a
# hurry. Kept at 30 s here, with the comment now agreeing.
#
# ⚑ AND ONE THING THIS HEADER CANNOT SHOW YOU: on a cache HIT nginx does not set
# X-PM-Upstream, because no upstream was contacted. So the operator can see
# which worker filled an entry only on a MISS. Measured by the reviewer, named
# here rather than left to be rediscovered at 3am.
location ~ ^/api/world/(apex|conversations|walkers|state|present)$ {
    limit_req zone=postmark_keyless burst=240 nodelay;
    limit_req_status 429;
    error_page 429 = @postmark_keyless_rate;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://$postmark_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering on;
    proxy_cache pmworld;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$host$uri$is_args$args|$http_authorization";  # the live shield dropped the cookie 2026-09-26 (the office authenticates by token, never cookies; a cookie only split the cache per visitor). Carried here 2026-10-18, review-240 #621.
    proxy_cache_valid 200 30s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_use_stale updating timeout;
    add_header X-PM-Cache $upstream_cache_status always;
    add_header X-PM-Upstream $upstream_addr always;
    proxy_read_timeout 60s;
}

# ── everything else under /api/ ─────────────────────────────────────────────
#
# ⚑ `proxy_pass http://$postmark_upstream;` WITH A VARIABLE DOES NOT APPEND THE
# LOCATION-STRIPPED URI the way `proxy_pass http://127.0.0.1:4380/;` does. That
# trailing slash is what strips /api today and it is not available here, so the
# `rewrite ... break` above does the stripping instead — the pattern the world
# block has used since the shield went in. Getting it wrong sends the office
# /api/town, which 404s.
location /api/ {
    limit_req zone=postmark_keyless burst=240 nodelay;
    limit_req_status 429;
    error_page 429 = @postmark_keyless_rate;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://$postmark_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 1m;
    add_header X-PM-Upstream $upstream_addr always;
}

# ── CARRIED FORWARD FROM THE LIVE SNIPPET, UNCHANGED ────────────────────────
#
# Courtesy: much of the MCP ecosystem mounts at the origin root, so /mcp is
# the natural guess (issue #307 — a resident's client 404'd here). Redirect
# rather than proxy: the canonical door stays /api/mcp, so OAuth discovery
# (RFC 9728 path-suffixed metadata) never forks. 308 preserves method + body.
location = /mcp {
    return 308 /api/mcp;
}
# The trailing-slash twin — some connector UIs normalize URLs with a final
# slash (FastMCP's own examples use one); /api/mcp/ already works (the
# office strips trailing slashes), so the root courtesy should too.
location = /mcp/ {
    return 308 /api/mcp;
}

# The shield answers in the office's own JSON shape (rate-limit install
# 2026-08-14). Named location; every `error_page 429` above reaches it.
location @postmark_keyless_rate {
    default_type application/json;
    add_header Retry-After 1 always;
    return 429 '{"error":"rate","defect":"the keyless GET budget is empty; try again in 1 second.","retry_after_s":1}';
}

# ── THE DIFF AGAINST WHAT IS LIVE TODAY ─────────────────────────────────────
#
# Live (/etc/nginx/snippets/postmark-api.conf, re-read 2026-09-08): SEVEN
# locations — /.well-known/oauth-, /.well-known/openid-configuration, the
# world-cache regex, /api/, = /mcp, = /mcp/, @postmark_keyless_rate. No
# `upstream` block exists anywhere in /etc/nginx; the world block proxies to
# 127.0.0.1:4380 and /api/ to 127.0.0.1:4380/ (the trailing slash is the strip).
#
# Proposed, across the two files:
#   + two upstream blocks and one map  -> conf.d/postmark-read-pool.conf
#     (http context; install FIRST or nginx -t refuses on an unknown upstream)
#   + ^~ /api/oauth/ pinned to the writer          THE SIGN-IN FIX
#   + ^~ /api/.well-known/ pinned to the writer    THE SIGN-IN FIX
#   + = /api/mcp pinned to the writer, ahead of the rest
#   ~ world-cache + /api/: upstream becomes $postmark_upstream (the pool), and
#     /api/'s trailing-slash strip becomes an explicit rewrite
#   = all seven live locations carried forward verbatim in behaviour
#   + X-PM-Upstream so an operator can see which worker answered (on a MISS)
#
# VERIFY AFTER A REAL RELOAD, in this order. THE OAUTH ROWS ARE NOT OPTIONAL —
# they are the ones that were broken and unmeasured at the last pin:
#   nginx -t
#   curl -s https://postmark.town/api/town | head -3          # the URI strip
#   curl -sI https://postmark.town/api/town | grep -i x-pm-upstream
#   curl -s https://postmark.town/api/release | grep -E 'role|write_grant'
#   curl -s -o /dev/null -w '%{http_code}\n' -X POST \
#        https://postmark.town/api/letters -d '{}'            # must NOT be 405
#   curl -sI https://postmark.town/api/mcp | head -1          # 401, not 405
#   # the dance — every one must reach the WRITER and must NOT be 405:
#   curl -sI 'https://postmark.town/api/oauth/authorize?client_id=x&redirect_uri=y' | head -1
#   curl -sI 'https://postmark.town/api/oauth/github/callback?code=x&state=y'      | head -1
#   curl -sI  https://postmark.town/api/oauth/berth-cosign                          | head -1
#   curl -s   https://postmark.town/api/.well-known/openid-configuration | head -3
#   curl -s   https://postmark.town/.well-known/openid-configuration     | head -3
#   curl -s   https://postmark.town/.well-known/oauth-protected-resource | head -3
#
# THE TWO THAT MATTER MOST. If a resident's letter comes back 405 "this office
# reads only", the map is wrong. If any OAuth row comes back 405, sign-in is
# down — take the pool out and revert this snippet; the writer alone serves
# everything exactly as it does today.
