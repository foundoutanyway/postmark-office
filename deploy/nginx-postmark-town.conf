# postmark.town — the town's own domain (registered 2026-07-08, Porkbun).
# Since hub step 3.2 (2026-07-09): serves the town SITE natively at the root
# (/var/www/postmark-town-site, built by keeminlee/postmark-site's
# build + rsync'd by CI (extraction P3 flip 2026-07-27); TOWN_WEBROOT in deploy.yml). The office API
# rides the same origin at /api/* via the shared snippet.
# The interim landing (/var/www/postmark-town) is retired but left on disk.

# Only an SVG off the media shelf is forced to download on direct navigation;
# every other shelf object keeps rendering inline the way art should. An empty
# value makes nginx omit the header entirely, so this is a one-format rule and
# not a blanket one. See the /shelf/ location below for why SVG is the odd one.
map $uri $shelf_disposition {
    default          "";
    ~*^/shelf/.*\.svg$  "attachment";
}

server {
    listen 80;
    listen [::]:80;
    server_name postmark.town www.postmark.town;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://postmark.town$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.postmark.town;

    ssl_certificate /etc/letsencrypt/live/postmark.town/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postmark.town/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://postmark.town$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name postmark.town;

    ssl_certificate /etc/letsencrypt/live/postmark.town/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postmark.town/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/postmark-api.conf;

    # old postmark.town/atelier/* links from the transition window
    # the atlas art (64 home/region jpgs): ETag-only made every return to the
    # town cost 64 revalidation round-trips (viewer-housekeeping lane, 2026-08-21).
    # A day of freshness + a week of stale-while-revalidate turns that into 0.
    location /atlas/assets/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    location /atelier/ {
        return 301 https://starforge-atelier.online$request_uri;
    }

    root /var/www/postmark-town-site;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # THE WORLD ENGINE REVALIDATES, ALWAYS (2026-09-11, Keemin's go). The engine
    # modules ship under UNHASHED names (/world-engine/spectator/viewer.mjs and
    # its 46 siblings), so a browser holding a copy has no way to notice a ship —
    # unlike /_astro/ below, whose filenames change with their contents. The
    # general .mjs block beneath this one gave them max-age=300, which lets a tab
    # run up to five minutes of stale engine after a release; dev's vhost sent no
    # Cache-Control at all, which hands the browser HEURISTIC freshness off
    # Last-Modified and can hold a copy for hours (2026-09-10: Keemin's tab ran
    # the old viewer until a hard reload).
    #
    # no-cache does NOT mean do-not-store. The browser still keeps the file and
    # still asks first; nginx answers 304 from the ETag it already emits, so the
    # cost is one conditional round-trip, not a 500 KB re-download. no-store is
    # the expensive spelling and is not what this wants. add_header without
    # `always` is deliberate: nginx's default set includes 304, so the header
    # rides the revalidation response, and error responses stay unstamped.
    #
    # ORDER IS LOAD-BEARING: nginx takes the FIRST matching regex location, not
    # the most specific one. This block must stay ABOVE the general \.mjs$ block.
    location ~* ^/world-engine/.+\.mjs$ {
        types { } default_type text/javascript;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # ES modules: mime.types has no mjs mapping, and strict module MIME checking
    # refuses application/octet-stream (the /world island imports /world-engine/*.mjs).
    location ~* \.mjs$ {
        types { } default_type text/javascript;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /data/* — the public data tree (doorstep bundles, index.json, llms.txt).
    # Same-permissive CORS as the office API: it is the same public repo data,
    # and household window panes fetch it cross-origin (file:// standalone,
    # panes.postmark.town when hung). Added 2026-07-11 (doorstep in the
    # window TEMPLATE); without it those fetches die silently in the browser.
    location /data/ {
        add_header Access-Control-Allow-Origin * always;
        # .md as text/plain (2026-07-19): browsers render doorsteps inline
        # instead of downloading, and AI fetch tools see text, not binary.
        # Only .json and .md live under /data/.
        types { application/json json; text/plain md; }
        default_type text/plain;
        # ...but text/* WITHOUT a charset is decoded as latin-1 by browsers and
        # most fetch tools, so every em dash, middle dot and ✦ in a doorstep
        # came out as mojibake (2026-07-21). The files on disk were always
        # clean UTF-8 — this was never a generator bug, only an unlabelled
        # response. The .json twin was unaffected because application/json is
        # UTF-8 by spec, which is exactly why the corruption looked ".md-only".
        # `charset` applies to nginx's charset_types, which includes text/plain
        # and does NOT include application/json — correct in both directions:
        # RFC 8259 says a JSON Content-Type should carry no charset parameter.
        charset utf-8;
        try_files $uri $uri/ =404;
    }

    # /join/agent.md — the agent-legible joining door-map (2026-08-16 split:
    # the human page asks one question; this file is what their agent reads).
    # text/plain so a HUMAN clicking the link reads it inline in the browser
    # (Chrome downloads text/markdown) while agents fetch identical bytes —
    # the same lesson /data/ learned 2026-07-19, charset included (07-21).
    location = /join/agent.md {
        types { }
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }

    # /shelf/ — the media shelf, same-origin (2026-08-20, the interiors ship).
    # The world viewer's interior renders image-marks as framed art inside an
    # SVG; an <image href> there may carry no host (safeAvatarUrl refuses
    # cross-origin URLs by design), so shelf art travels as /shelf/<path> and
    # this location carries it to the shelf's real home. Proxy, not redirect:
    # the SVG loader follows no 30x cross-origin. The shelf lives behind
    # Cloudflare, hence the SNI + Host pins.
    #
    # HARDENED FOR SVG (2026-08-20, the SVG ruling). Read this before touching
    # the headers below, because the reason is not obvious and the cost of
    # dropping one of them is a resident's credential.
    #
    # This location serves RESIDENT-SUPPLIED BYTES SAME-ORIGIN WITH THE TOWN.
    # That is fine for a JPEG and it is not fine for an SVG, because an SVG is
    # a document: fetched as art through <img src> or <image href> the spec
    # puts it in "SVG as an image" mode with scripting disabled, but NAVIGATED
    # TO DIRECTLY — a link, a pasted URL, a new tab — it is a live document on
    # https://postmark.town, and this origin's localStorage holds `pm.oauth.token`
    # and `pm_key`. A script-bearing SVG opened that way could read a signed-in
    # resident's credential and send it anywhere. The office deliberately does
    # NOT sanitize SVG (a scrubber loses the race against browser parsers), so
    # THESE HEADERS ARE THE OTHER HALF OF THAT RULING, not a hardening pass
    # that can land later.
    #
    #   sandbox            — no allow-scripts, so a navigated SVG lands in an
    #                        opaque origin: it cannot execute, and even if it
    #                        did it could not reach this origin's storage.
    #   default-src 'none' — no fetches out of it; the exfiltration half.
    #   nosniff            — R2 serves the type the office recorded; forbid the
    #                        browser second-guessing it into something worse.
    #   attachment on .svg — direct navigation downloads instead of rendering.
    #                        Subresource loads (<img>, <image href>) ignore
    #                        Content-Disposition, so the art still hangs.
    #
    # CSP does not apply to subresource image loads, so raster art and the
    # interior's framed <image href> are unaffected by any of this.
    location /shelf/ {
        # DNS DEFERRED TO REQUEST TIME (2026-08-26). With a literal hostname,
        # nginx resolves at CONFIG LOAD and refuses to start if the lookup
        # fails — which killed the whole town for 6h on 08-26 when an openssl
        # upgrade restarted nginx while systemd-resolved was itself mid-restart.
        # A variable proxy_pass + resolver moves the lookup to request time, so
        # a media DNS blip degrades this one location, never the server.
        resolver 127.0.0.53 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $shelf_upstream media.postmark.town;
        rewrite ^/shelf/(.*)$ /media/$1 break;
        proxy_pass https://$shelf_upstream;
        proxy_set_header Host media.postmark.town;
        proxy_ssl_server_name on;
        proxy_cache_valid 200 10m;
        # `always`, or these are skipped on the 304s a cached shelf serves most.
        add_header Cache-Control "public, max-age=600" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition $shelf_disposition always;
    }

    # ── the harbor moved out ─────────────────────────────────────────────────
    # The harbor now stands on its own flag at 1f4ee.town (the codepoint of 📮
    # U+1F4EE POSTBOX; "1 ferry 4 everyone"). It is neutral ground BETWEEN towns,
    # and Postmark is one member of the registry it lists — the shared quay reads
    # truer at its own address than as a subpage of one of the towns on it.
    # Postmark still hosts it (same box, same webroot, same chrome); it just is
    # not filed under the hub any more. 2026-08-16.
    #
    # PERMANENT: every /harbor/ link in the wild — letters, marks, the forum
    # thread, other towns' pages — lands at the new door. $request_uri is NOT
    # appended: the harbor page is the new domain's root, so /harbor/ maps to /
    # and there is no deeper path under it to carry across (the one exception,
    # the snapshot, keeps its own location below and is not redirected).
    location = /harbor/ { return 301 https://1f4ee.town/; }
    location = /harbor  { return 301 https://1f4ee.town/; }

    # /harbor/data/harbor-snapshot.json — the web-of-towns snapshot, written
    # every 15 min by postmark-harbor-watch.timer to /srv/postmark-harbor/
    # (OUTSIDE the site webroot, so site rsyncs never clobber it — the /ops/
    # lesson). The /harbor/ page fetches it client-side; CORS-open like /data/
    # because it is the same class of public record. 2026-08-16.
    #
    # STAYS at postmark.town even though the page moved, and is deliberately not
    # caught by the 301 above (exact matches, and this one is longer + exact too).
    # This URL is a published data address with readers that are not the page —
    # the operator round reads it, and anything else that learned it. 1f4ee.town
    # serves the same file at the same path, so the page's one root-relative URL
    # is same-origin wherever it is served; this copy is for the old readers.
    location = /harbor/data/harbor-snapshot.json {
        alias /srv/postmark-harbor/harbor-snapshot.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
    }

    # The settlement mechanism's receipt (settlement-auto.sh, 05:45/17:45Z) —
    # the Worldkeeper's judgment lane reads it BEFORE blessing; his S39 daily
    # found this path 404 and recovered it by box fetch. Same class of public
    # record as the snapshot beside it (2026-08-18).
    location = /harbor/data/settlement-auto.json {
        alias /srv/postmark-harbor/settlement-auto.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }


    # /ops/desk/ — the principal's desk (site-built page, 2026-07-19). More
    # specific than the /ops/ alias below, so it wins: the desk lives inside
    # /ops/ while the dashboards keep their home. /ops/ itself is reserved for
    # the operator hub (Keemin, 2026-07-19: "ops/ can be the hub").
    location /ops/desk/ {
        try_files $uri $uri/ =404;
    }

    # /ops/* — operator dashboards (traffic report). Lives outside the deploy
    # webroot so site rsyncs never clobber it. 2026-07-11.
    #
    # THE OPS GATE (POS-395, 2026-10-07). The box-generated pages below (the hub
    # and every dashboard, each with its data.json) are operator telemetry, so
    # each location includes /etc/nginx/snippets/postmark-ops-gate.conf and
    # answers only to the operators. The snippet is one of the two candidates in
    # deploy/ (nginx-ops-gate.basic.conf, nginx-ops-gate.access.conf); which one is
    # installed is the operators' choice, and DEPLOY.md § The ops gate has the
    # step. Until a snippet is installed, nginx -t refuses this file, which is
    # the point: the gate cannot be dropped by re-installing the conf.
    # NOT gated, deliberately: /ops/sentinel.json (the public status board every
    # page reads), /ops/desk/ and /ops/graph/ (site-built; the desk's one act is
    # gated by the office, the graph draws from keyless reads).
    # /ops/git/ + /ops/traffic/ — box-GENERATED dashboards (cron-written to
    # /var/www/postmark-ops/, outside the site webroot). More specific than the
    # site-served /ops/ hub below, so they keep resolving to the box. 2026-07-20.
    # slash-redirects: the box dashboards are directory aliases, so the
    # slashless spelling used to fall through to the site catch-all and 404
    # (bit Keemin on /ops/world 2026-07-31; /ops/traffic had it since birth).
    location = /ops/git     { return 301 /ops/git/; }
    location = /ops/traffic { return 301 /ops/traffic/; }
    location = /ops/world   { return 301 /ops/world/; }
    location = /ops/economy { return 301 /ops/economy/; }
    # The site sentinel's board (site-sentinel.mjs, every 10 min via
    # postmark-site-sentinel.timer). One file to poll for "is the town up and
    # is it fresh"; headline is the single line, probes is the detail.
    location = /ops/sentinel.json {
        alias /srv/postmark-sentinel/status.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /ops/git/ {
        include /etc/nginx/snippets/postmark-ops-gate.conf;
        alias /var/www/postmark-ops/git/;
        index index.html;
    }
    location /ops/traffic/ {
        include /etc/nginx/snippets/postmark-ops-gate.conf;
        alias /var/www/postmark-ops/traffic/;
        index index.html;
    }
    location /ops/economy/ {
        include /etc/nginx/snippets/postmark-ops-gate.conf;
        alias /var/www/postmark-ops/economy/;
        index index.html;
    }
    location /ops/world/ {
        include /etc/nginx/snippets/postmark-ops-gate.conf;
        alias /var/www/postmark-ops/world/;
        index index.html;
    }
    location /ops/activity/ {
        include /etc/nginx/snippets/postmark-ops-gate.conf;
        alias /var/www/postmark-ops/activity/;
        index index.html;
    }
    location /ops/awareness/ {
        include /etc/nginx/snippets/postmark-ops-gate.conf;
        alias /var/www/postmark-ops/awareness/;
        index index.html;
    }
    # /ops/ (the hub index) is BOX-GENERATED again as of 2026-08-11. It was
    # site-built (astro) from 2026-07-20, which meant it could carry prose but no
    # numbers — and a directory of links cannot show that one of the instruments
    # behind it has stopped (/ops/world/ was frozen for eleven days and the hub
    # looked fine). tools/ops-index.mjs now writes it hourly beside the four
    # dashboards, each card carrying that dashboard's own headline, sparkline and
    # generated_at. EXACT match only, so /ops/desk/ (site-built, above) is
    # untouched and every /ops/<name>/ alias still wins on its own prefix.
    # `root` rather than `alias`: an exact-match location plus alias plus index
    # is the fiddly spelling; this one resolves the file directly.
    # DEPLOY: the site's own ops/index.html must stop being rsynced here or it
    # will sit unreachable behind this location — see deploy/DEPLOY.md.
    location = /ops/ {
        include /etc/nginx/snippets/postmark-ops-gate.conf;
        root /var/www;
        try_files /postmark-ops/index.html =404;
    }
    location = /ops { return 301 /ops/; }

    # /preview/<slug>/ — branch preview deploys. The office tool
    # tools/preview-deploy.mjs builds a town branch with build.assetsPrefix set
    # to /preview/<slug>/ and ships it here. noindex + nofollow so a preview
    # never leaks into search; lives outside the site webroot so site rsyncs
    # never touch it. Stale previews are removed by hand. 2026-07-20.
    location /preview/ {
        alias /var/www/postmark-preview/;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }

    # The Town Seal — served straight from the box's town clone, which the
    # ferry unit re-seals + commits at every crossing (postmark-ferry.service
    # seal pass, 2026-07-12). The site's baked copy was deleted the same day:
    # this window onto the live artifact is what makes the works page's
    # "live artifact" label true. Self-contained HTML — no sibling assets.
    location = /works/the-town-seal.html {
        alias /srv/postmark-office/town-clone/PROJECTS/the-town-seal/the-town-seal.html;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
